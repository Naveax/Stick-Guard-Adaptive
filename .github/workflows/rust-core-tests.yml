name: GuardAdaptive Rust tests
on:
  push:
    branches: [main]
    paths: ['guardadaptive-core/**', '.github/workflows/rust-core-tests.yml']
  pull_request:
    paths: ['guardadaptive-core/**', '.github/workflows/rust-core-tests.yml']
permissions:
  contents: read
jobs:
  rust-core:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: guardadaptive-core
    steps:
      - uses: actions/checkout@v4
      - name: Use pinned Rust 1.93.0 with Clippy
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component clippy
          rustup default 1.93.0
      - name: Check
        run: cargo check --locked --offline
      - name: Clippy strict all targets
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked --offline
