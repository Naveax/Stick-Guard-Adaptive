name: Remote Lab tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    name: Node.js tests (23)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote-lab
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check server.cjs
          node --check telemetry.cjs
          node --check paired-study.cjs
          node --check public/app.js
          node --check public/idle-quality.js
          node --check public/neutral-preview.js
          node --check public/neutral-evidence-v87.js
      - name: Run tests without external services
        run: node --test test.cjs paired-study.test.cjs telemetry.test.cjs idle-quality.test.cjs neutral-preview.test.cjs neutral-evidence-v87.test.cjs
