# TEMPLATE ONLY for an nginx HTTP TLS virtual-host stack.
# Never use if existing ReVoltVPN nginx stream / Xray owns TCP :443.
# Supply a valid TLS certificate and domain before enabling this file.
server {
    listen 443 ssl;
    server_name lab.example.org;
    ssl_certificate /etc/letsencrypt/live/lab.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 850k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:48927;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
